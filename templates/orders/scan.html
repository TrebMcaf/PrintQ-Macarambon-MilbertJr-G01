{% extends "base.html" %}
{% load static %}
{% block title %}Scan an order{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Scan an order</h1>
  <p class="lead-sm">Point the camera at a customer's QR code to open their order.</p>
</div>

<div id="scan-root" data-lookup="{% url 'orders:scan_lookup' %}">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="scan-stage" id="scan-stage" hidden>
        <video id="scan-video" playsinline muted autoplay></video>
        <div class="scan-frame" aria-hidden="true"></div>
      </div>
      <p id="scan-status" class="scan-status" role="status" aria-live="polite">Camera is off.</p>
      <div class="d-grid gap-2 d-sm-flex">
        <button type="button" class="btn btn-primary btn-lg" id="scan-start">Start camera</button>
        <button type="button" class="btn btn-outline-secondary btn-lg" id="scan-torch" aria-pressed="false" hidden>Torch</button>
        <button type="button" class="btn btn-outline-secondary btn-lg" id="scan-stop" hidden>Stop camera</button>
        <label class="btn btn-outline-secondary btn-lg mb-0" for="scan-file">Scan from a photo</label>
        <input type="file" id="scan-file" accept="image/*" capture="environment" class="visually-hidden">
      </div>
      <noscript><p class="text-danger mt-3">The camera needs JavaScript. You can still type the code.</p></noscript>
    </div>
    <div class="col-lg-5">
      <div class="card">
        <div class="card-body">
          <h2 class="section-title">Or type the code</h2>
          <form method="get" action="{% url 'orders:scan_lookup' %}">
            <label class="form-label" for="scan-code">Tracking code</label>
            <input id="scan-code" name="code" class="form-control form-control-lg mb-3" maxlength="200" inputmode="text" autocapitalize="characters" autocomplete="off" enterkeyhint="go" placeholder="PQ-2026-0001" required>
            <button type="submit" class="btn btn-primary btn-lg w-100">Find order</button>
          </form>
          <p class="form-text mb-0">You can also paste the link from a customer's QR code.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'vendor/jsqr/jsQR.js' %}" defer></script>
<script src="{% static 'js/scan.js' %}" defer></script>
{% endblock %}
