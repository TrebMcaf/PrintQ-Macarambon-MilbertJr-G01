<div class="modal fade" id="qr-modal" tabindex="-1" aria-labelledby="qr-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="qr-modal-title">{{ order.tracking_code }}</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="qr-big">{{ qr_svg }}</div>
        <p class="text-center text-muted mt-3 mb-0">Hold your screen steady in front of the shop's scanner.</p>
      </div>
    </div>
  </div>
</div>
