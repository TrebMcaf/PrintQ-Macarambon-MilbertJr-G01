<div class="messages" aria-live="polite">
{% for message in messages %}
  <div class="alert alert-{{ message.level_tag }} alert-dismissible fade show"{% if message.level_tag == "danger" %} role="alert"{% else %} role="status"{% endif %}>{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>
{% endfor %}
</div>
