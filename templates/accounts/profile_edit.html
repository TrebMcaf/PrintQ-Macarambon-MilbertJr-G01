{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<h1>Edit profile</h1>
<form method="post" class="card form">{% csrf_token %}{{ form.as_p }}<button type="submit">Save changes</button></form>
<p class="muted">Your role can't be changed here.</p>
<p><a href="{% url 'accounts:profile' %}">Cancel</a></p>
{% endblock %}
