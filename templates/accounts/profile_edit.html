{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Edit profile</h1>
</div>
<div class="row">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include "partials/form.html" with form=form %}
          <div class="d-flex flex-wrap align-items-center gap-2">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-link" href="{% url 'accounts:profile' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    <p class="form-text">Your role can't be changed here.</p>
  </div>
</div>
{% endblock %}
