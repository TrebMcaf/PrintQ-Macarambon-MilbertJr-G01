{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1>Student sign up</h1>
<form method="post" class="card form">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Create account</button>
</form>
<p>Already registered? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
{% endblock %}
